# Локальный стенд в k3d: HTTP на http://localhost:8080, без TLS и доменов.
# Запуск пошагово — в k8s/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: streamservice

resources:
  - ../../base

images:
  - name: streamservice-api
    newTag: dev
  - name: streamservice-web
    newTag: dev
  - name: streamservice-mediamtx
    newTag: dev

# ТОЛЬКО для локального стенда. Значения нарочито игрушечные и совпадают с
# дефолтами docker-compose.yml. MEDIAMTX_API_PASS обязан совпадать с паролем
# пользователя api в mediamtx.yml (authInternalUsers), иначе api не достучится
# до control-API MediaMTX. Боевой Secret в репозиторий не кладётся.
secretGenerator:
  - name: streamservice-secrets
    literals:
      - POSTGRES_PASSWORD=streampass
      - JWT_SECRET=local-dev-only-not-a-secret-0123456789
      - MEDIAMTX_API_USER=api
      - MEDIAMTX_API_PASS=mediamtxpass
      - MEDIAMTX_WEBHOOK_SECRET=local-dev-webhook
      - SUPERADMIN_LOGIN=admin
      - SUPERADMIN_PASSWORD=adminpass
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin123
      - SMTP_USER=
      - SMTP_PASS=
      - TELEGRAM_BOT_TOKEN=
      - GOOGLE_INDEXING_CREDENTIALS=
    options:
      disableNameSuffixHash: true

patches:
  - target:
      kind: ConfigMap
      name: streamservice-config
    patch: |-
      - op: replace
        path: /data/CORS_ORIGIN
        value: "http://localhost:8080"
      # По HTTP браузер не сохранит Secure-cookie, и /v1/org/me вернёт 401.
      - op: replace
        path: /data/COOKIE_SECURE
        value: "false"
      # Presigned-ссылки открывает браузер, ему нужен достижимый адрес MinIO:
      # kubectl -n streamservice port-forward svc/minio 9000:9000
      - op: replace
        path: /data/S3_PUBLIC_ENDPOINT
        value: "http://localhost:9000"
      # Локальной машине семь ядер на x264 не нужны.
      - op: replace
        path: /data/HLS_LQ_ENABLED
        value: "false"
