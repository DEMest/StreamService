# ЧЕРНОВИК. Маршруты основного домена и поддоменов, перенесённые из
# infra/deploy/nginx-streamservice.conf (снимок 2026-09-02) на Ingress + Traefik.
# Файл сгенерирован по таблице маршрутов и правится руками как обычный YAML.
#
# Как читать приоритеты. Traefik выбирает маршрут по длине правила, а Exact-путь
# короче Prefix-пути, поэтому полагаться на «самый длинный выигрывает» нельзя.
# Приоритет задан явно (аннотация router.priority):
#   200  точные редиректы (ads: «/»)
#   150  защитные маршруты основного домена (/admin, /api/v1/admin)
#   100  обычные маршруты
#    50  ads: /admin → кабинет (уступает /admin/ads, который 100)
#     1  catch-all'ы поддоменов и http→https
# Если правишь маршруты — перепроверь порядок на каждом хосте.

# Основной сайт → Next.js (он сам проксирует /api и /hls на api через rewrites).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site-main
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: streamservice-security-headers@kubernetescrd,streamservice-body-limit@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - liga-live.ru
      secretName: liga-live-tls
  rules:
    - host: liga-live.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
---
# Чат (WebSocket) → api. Без body-limit: buffering ломает апгрейд соединения.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site-socketio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: streamservice-security-headers@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - liga-live.ru
      secretName: liga-live-tls
  rules:
    - host: liga-live.ru
      http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
---
# Публичная статика лендинга (демо-ролик) → бакет streamservice-public в MinIO.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site-static
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: streamservice-static-to-bucket@kubernetescrd,streamservice-security-headers@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - liga-live.ru
      secretName: liga-live-tls
  rules:
    - host: liga-live.ru
      http:
        paths:
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  name: s3
---
# Админки на основном домене нет: /admin уезжает на admin.liga-live.ru.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
