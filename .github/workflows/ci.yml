name: CI

# Проверки гоняются на каждый PR в main и на сам main после слияния.
# Прогон на main нужен, чтобы поймать поломку от семантического конфликта:
# два PR по отдельности зелёные, а вместе — нет.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Ручной запуск. Нужен не для удобства: push и pull_request зависят от
  # доставки событий, а workflow_dispatch дёргается прямым вызовом API — это
  # запасной путь, когда доставка событий у GitHub деградирует (проверено на
  # аварии 2026-08-06, когда пуши перестали порождать прогоны).
  # Работает только для workflow, лежащего на ветке по умолчанию.
  workflow_dispatch:
    inputs:
      force_mediamtx:
        description: >-
          Перезапустить mediamtx даже под эфиром. Обрывает приём SRT/RTMP
          у ВСЕХ стримеров разом — им понадобится реконнект.
        type: boolean
        default: false

# Новый пуш в PR отменяет предыдущий незавершённый прогон — не держим очередь
# ради результата, который уже никому не нужен. На main НЕ отменяем: история
# проверок самой основной ветки должна быть полной.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API — сборка и тесты
    # Свой раннер (infra/ci-runner). Хостовые перестали выдаваться: джобы
    # висели в очереди и отменялись с "The job was not acquired by Runner of
    # type hosted even after multiple attempts".
    runs-on: self-hosted
    steps:
      # v7, а не v4: v4 собран под Node 20, раннер уже принудительно гоняет его
      # на Node 24 и пишет предупреждение о снятии с поддержки. v7 требует
      # раннера не ниже 2.327.1 — в образе 2.336.0 (infra/ci-runner/Dockerfile).
      - uses: actions/checkout@v7

      # Намеренно НЕ используем pnpm/action-setup и actions/setup-node: каждое
      # действие качается с codeload.github.com при прогоне, а Node 20 и
      # corepack уже лежат в образе раннера (infra/ci-runner/Dockerfile).
      # Меньше внешних зависимостей — меньше поводов упасть; на аварии
      # 2026-08-06 джоба намертво вставала именно на скачивании action'ов.
      # Версию pnpm corepack берёт из "packageManager" в корневом package.json.
      - name: Активация pnpm
        run: |
          corepack prepare --activate
          pnpm --version

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      # Схема лежит в корне репозитория; путь прописан в apps/api/package.json
      # ("prisma": { "schema": "../../prisma/schema.prisma" }).
      # Без generate нет типов @prisma/client — не соберётся ни nest, ни jest.
      - name: Генерация клиента Prisma
        run: pnpm --filter api exec prisma generate

      # nest build прогоняет tsc — отдельная проверка типов не нужна.
      - name: Сборка (она же проверка типов)
        run: pnpm --filter api build

      - name: Тесты
        run: pnpm --filter api test

  web:
    name: Web — типы и сборка
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Активация pnpm
        run: |
          corepack prepare --activate
          pnpm --version

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      # Отдельный проход tsc: next build проверяет только то, что достижимо
      # из страниц, а tsc — весь src, включая пока не подключённые компоненты.
      - name: Проверка типов
        run: pnpm --filter web exec tsc --noEmit

      # NEXT_PUBLIC_* не задаём намеренно: в сборке должны работать дефолты из
      # кода. Если сборка без них падает — это баг, и его надо видеть здесь.
      - name: Сборка
        run: pnpm --filter web build

  # ─────────────────────────────────────────────────────────────────────────
  # Выкатка на прод. Идёт только после зелёных api и web, и только на push в
  # main (то есть на мерж PR) — на сами PR не запускается никогда.
  #
  # Почему self-hosted, а не ubuntu-latest с Tailscale, как в соседнем проекте:
  # hosted-раннеры этому репозиторию перестали выдаваться (см. комментарий у
  # job api), а наш собственный раннер и так стоит на той же машине, что и
  # прод — он дотягивается до SSH хоста напрямую. Лишний слой Tailscale здесь
  # ничего не добавляет.
  #
  # Раннеру по-прежнему НЕ даётся docker-сокет: он заходит на хост по SSH
  # ключом из секретов, и только в этой джобе. Привилегия живёт в ключе, а не
  # в раннере.
  #
  # environment: production — не косметика. Секреты ниже привязаны к этому
  # окружению, а у окружения в настройках репозитория должно стоять правило
  # "Deployment branches: main only". Тогда воркфлоу, изменённый в чьём-то PR,
  # до ключа не доберётся: GitHub не отдаст секреты окружения джобе, которая
  # запущена не с main.
  deploy:
    name: Выкатка на прод
    needs: [api, web]
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted
    environment: production
    # Две выкатки внахлёст сломали бы health-gate друг другу: отменять текущую
    # нельзя (оборвём на середине), поэтому просто становимся в очередь.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Ключ и known_hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Скрипт лежит в репозитории и уже обновлён на сервере шагом git pull
      # внутри самого скрипта. Здесь мы его только запускаем — вся логика
      # (проверка эфира, --no-deps, health-gate, откат, prune) там.
      - name: Запуск infra/deploy/deploy.sh на сервере
        # Форс доступен только через ручной запуск: на push инпутов нет и сюда
        # придёт 0. Значение подставляет bash раннера до вызова ssh.
        env:
          FORCE_MEDIAMTX: ${{ github.event_name == 'workflow_dispatch' && inputs.force_mediamtx && '1' || '0' }}
          # Через ssh переменные окружения раннера не передаются, а в письмах
          # нужна ссылка на прогон — пробрасываем явно.
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=10 \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "cd '${{ secrets.DEPLOY_PATH }}' && git fetch origin main --quiet && git checkout main --quiet && git merge --ff-only origin/main --quiet && FORCE_MEDIAMTX=$FORCE_MEDIAMTX GITHUB_RUN_ID=$GITHUB_RUN_ID GITHUB_REPOSITORY=$GITHUB_REPOSITORY bash infra/deploy/deploy.sh"

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/deploy_key
