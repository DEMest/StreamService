services:
  # ─── PostgreSQL ───
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-streamservice}-postgres
    environment:
      POSTGRES_DB: streamservice
      POSTGRES_USER: stream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streampass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stream -d streamservice"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── MinIO (локальный S3-совместимый стенд для архива) ───
  minio:
    image: minio/minio:latest
    container_name: ${COMPOSE_PROJECT_NAME:-streamservice}-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      # На хост наружу (0.0.0.0) не публикуем — api ходит в minio по имени
      # контейнера через internal-сеть. 127.0.0.1 — для локальной админки/mc
      # через SSH-туннель при необходимости.
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      # НЕ curl: свежие образы minio/minio его не содержат — healthcheck с curl
      # никогда не проходит, и api (depends_on: service_healthy) блокирует весь стек.
      # `mc ready local` — рекомендованный самим MinIO способ, mc есть в образе.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    # edge нужна, чтобы edge-nginx резолвил streamservice-minio по имени
    # (прямой TLS-проброс на :9443 в streamservice.conf для presigned-ссылок).
    networks:
      - default
      - edge
    restart: unless-stopped

  # ─── MediaMTX ───
  mediamtx:
    build:
      context: ./infra/mediamtx
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-streamservice}-mediamtx
    ports:
      # Наружу торчит только ингест (SRT/RTMP). HLS (8888) отдаёт API через nginx,
      # а control-API (9997) дёргает только контейнер api по внутренней docker-сети —
      # публиковать их на хост незачем (иначе доступны всей локалке/Tailscale в обход nginx/ufw).
      - "${MEDIAMTX_SRT_PORT:-8890}:8890/udp"
      - "${MEDIAMTX_RTMP_PORT:-1935}:1935/tcp"
    environment:
      MEDIAMTX_WEBHOOK_SECRET: ${MEDIAMTX_WEBHOOK_SECRET:-}
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - recordings_data:/recordings
      - hls_data:/hls
    restart: unless-stopped

  # ─── API ───
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-streamservice}-api
    # host-порт не публикуем: nginx ходит в api по имени контейнера через сеть edge.
    volumes:
      - recordings_data:/recordings
      - hls_data:/hls
      # Лог nginx для метрик ёмкости — только на чтение. Том общий с ВНЕШНИМ
      # стеком nginx: создаёт его ЭТОТ стек, а nginx подключается к готовому
      # (см. docs/capacity-metrics-setup.md). Наоборот делать нельзя — том с
      # external:true, которого ещё нет, уронил бы автодеплой прода.
      # Пока nginx в него не пишет, метрики отдачи нулевые; ничего не ломается.
      - nginx_logs:/var/log/nginx:ro
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 3001
      DATABASE_URL: postgresql://stream:${POSTGRES_PASSWORD:-streampass}@postgres:5432/streamservice
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_API_USER: ${MEDIAMTX_API_USER:-api}
      MEDIAMTX_API_PASS: ${MEDIAMTX_API_PASS:-mediamtxpass}
      SUPERADMIN_LOGIN: ${SUPERADMIN_LOGIN:-admin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-adminpass}
      MEDIAMTX_WEBHOOK_SECRET: ${MEDIAMTX_WEBHOOK_SECRET:-}
      # Отдаются дашборду как строка подключения для энкодера
      # (GET /v1/org/ingest-config). Порты — те же переменные, которыми mediamtx
      # публикует ингест наружу, поэтому разъехаться не могут.
      MEDIAMTX_SRT_PORT: ${MEDIAMTX_SRT_PORT:-8890}
      MEDIAMTX_RTMP_PORT: ${MEDIAMTX_RTMP_PORT:-1935}
      # Пусто — дашборд подставит хост, на котором открыт сам. Задавать нужно,
      # только если ингест принимает не на том же хосте, что отдаёт веб-морду.
      INGEST_HOST: ${INGEST_HOST:-}
      # Прод (HTTPS) — оставить пустым (тогда secure берётся из NODE_ENV).
      # Тест-стенд по HTTP — выставить COOKIE_SECURE=false в .env, иначе браузер
      # не сохранит cookie и /v1/org/me вернёт 401.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      # Endpoint для presigned-ссылок: должен быть достижим ИЗ БРАУЗЕРА зрителя
      # (S3_ENDPOINT — внутренний docker-адрес, браузер его не резолвит).
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-streamservice-archive}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      RECORDING_GLUE_TIMEOUT_MINUTES: ${RECORDING_GLUE_TIMEOUT_MINUTES:-60}
      # Уведомления об обращениях в обратную связь. Имена переменных те же,
      # что у ~/ops/notify.env, которым шлёт письма деплой. Пусто — обращения
      # копятся в /admin/feedback, письмо не уходит.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}
      # Ссылка на /admin/feedback в письме + абсолютные URL для SEO. Она же
      # включает пинг поисковикам: пусто/localhost — пинг выключен.
      SITE_URL: ${SITE_URL:-}
      # SEO-пинг при старте/завершении эфира. IndexNow (Яндекс, Bing) работает
      # с ключом по умолчанию — переменная нужна, только если ключ меняли.
      # Google Indexing API молчит, пока нет сервис-аккаунта.
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      GOOGLE_INDEXING_CREDENTIALS: ${GOOGLE_INDEXING_CREDENTIALS:-}
      # Метрики ёмкости (/admin/capacity). UPLINK_MBPS — ширина канала
      # сервера; от неё считается и заполнение, и весь потолок по зрителям,
      # поэтому ошибка здесь смещает вывод о необходимости CDN целиком.
      UPLINK_MBPS: ${UPLINK_MBPS:-750}
      CAPACITY_HEADROOM: ${CAPACITY_HEADROOM:-0.2}
      # Лог nginx, размеченный под метрики; том с ним смонтирован выше.
      NGINX_LOG_PATH: ${NGINX_LOG_PATH:-/var/log/nginx/capacity.log}
      # true — синтетическая нагрузка вместо реальной. Только для стенда.
      CAPACITY_DEMO: ${CAPACITY_DEMO:-false}
      # Тревоги об инцидентах. Пусто — уходят только письмом через SMTP выше.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      mediamtx:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - default
      - edge
    restart: unless-stopped

  # ─── Web ───
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_UPSTREAM: http://api:3001
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3001}
        # Адрес и порты ингеста сюда НЕ передаются: они приезжают в браузер в
        # рантайме через GET /v1/org/ingest-config (см. сервис api ниже).
        # Иначе смена сервера требовала бы `docker compose build web`, а не
        # правки .env — NEXT_PUBLIC_* зашиваются в бандл на сборке.
        # Демо-ролик лендинга: отдаётся из публичного бакета объектного
        # хранилища, в репозитории/образе его нет. Пусто — лендинг не ломается,
        # блок демо показывает статичную заглушку.
        NEXT_PUBLIC_DEMO_VIDEO_URL: ${NEXT_PUBLIC_DEMO_VIDEO_URL:-}
        # Нужен на сборке: Next.js фиксирует metadataBase при пререндере
        # статических страниц, иначе canonical/og:url у лендинга и разделов
        # остаются относительными. Ту же переменную сервис получает и в
        # рантайме (см. environment ниже) — она перекрывает зашитую.
        SITE_URL: ${SITE_URL:-}
        # Коды подтверждения прав вебмастера — тоже на сборку: мета-тег
        # должен быть в HTML, который отдаёт статически отрендеренный лендинг.
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
        YANDEX_VERIFICATION: ${YANDEX_VERIFICATION:-}
    container_name: ${COMPOSE_PROJECT_NAME:-streamservice}-web
    # host-порт не публикуем: nginx ходит в web по имени контейнера через сеть edge.
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_STREAM_BASE_URL: /hls/live
      # Runtime-секрет (НЕ NEXT_PUBLIC — в браузер не утекает). Нужен middleware
      # для локальной проверки подписи access-токена. Должен совпадать с JWT_SECRET
      # сервиса api, иначе middleware будет продлевать токен на каждой навигации.
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      # Абсолютный адрес сайта для canonical, og:url, sitemap.xml и robots.txt.
      # Runtime, а не build-arg: переезд на другой домен — правка .env, а не
      # пересборка образа (тот же принцип, что у INGEST_HOST).
      SITE_URL: ${SITE_URL:-}
    depends_on:
      - api
      - mediamtx
    networks:
      - default
      - edge
    restart: unless-stopped

networks:
  default:
  edge:
    external: true

volumes:
  postgres_data:
  recordings_data:
  hls_data:
  minio_data:
  # Общий с внешним стеком nginx: nginx пишет лог, api читает. Полное имя тома
  # в docker — `<имя проекта>_nginx_logs`; именно его нужно подключить к nginx
  # как external, см. docs/capacity-metrics-setup.md.
  nginx_logs: