apiVersion: v1
kind: Service
metadata:
  name: web
  annotations:
    traefik.ingress.kubernetes.io/service.nativelb: "true"
    traefik.ingress.kubernetes.io/service.serverstransport: streamservice-web-drain@kubernetescrd
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: streamservice
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: streamservice
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: streamservice
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: publish-static
          image: streamservice-web
          command: ["/bin/sh", "/etc/web-assets/publish.sh"]
          volumeMounts:
            - name: web-assets
              mountPath: /srv/web-assets
            - name: web-assets-config
              mountPath: /etc/web-assets
              readOnly: true
      containers:
        - name: web
          # Образ собирается с build-arg'ами (NEXT_PUBLIC_*, API_UPSTREAM,
          # SITE_URL): они зашиваются в бандл на сборке, см. apps/web/Dockerfile
          # и k8s/README.md. API_UPSTREAM=http://api:3001 — это имя сервиса api
          # из api.yaml, менять его нельзя.
          image: streamservice-web
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: streamservice-config
                  key: NODE_ENV
            - name: NEXT_PUBLIC_API_URL
              value: /api
            - name: NEXT_PUBLIC_STREAM_BASE_URL
              value: /hls/live
            # Runtime-секрет middleware для проверки подписи access-токена.
            # Должен совпадать с JWT_SECRET сервиса api (оба из одного Secret).
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: streamservice-secrets
                  key: JWT_SECRET
            - name: SITE_URL
              valueFrom:
                configMapKeyRef:
                  name: streamservice-config
                  key: SITE_URL
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
            timeoutSeconds: 5
          lifecycle:
            preStop:
              exec:
                # Оставляем HTTP-процесс доступным, пока Traefik убирает
                # завершающийся под из списка endpoint'ов.
                command: ["sleep", "10"]
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: web-assets
          persistentVolumeClaim:
            claimName: web-assets
        - name: web-assets-config
          configMap:
            name: web-assets-config
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: web-drain
spec:
  # При замене пода открываем новое соединение через Service вместо
  # повторного использования соединения к завершающемуся поду.
  maxIdleConnsPerHost: -1
