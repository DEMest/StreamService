services:
  nginx:
    image: nginx:alpine
    container_name: streamservice-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/deploy/nginx-streamservice.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/regru:/etc/ssl/regru:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streamservice
      POSTGRES_USER: stream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streampass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stream -d streamservice"]
      interval: 5s
      timeout: 5s
      retries: 5

  mediamtx:
    build:
      context: ./infra/mediamtx
      dockerfile: Dockerfile
    container_name: streamservice-mediamtx
    ports:
      - "${MEDIAMTX_SRT_PORT:-8890}:8890/udp"
    environment:
      MEDIAMTX_WEBHOOK_SECRET: ${MEDIAMTX_WEBHOOK_SECRET:-}
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - recordings_data:/recordings
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: streamservice-api
    volumes:
      - recordings_data:/recordings
      - uploads_data:/app/uploads
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://stream:${POSTGRES_PASSWORD:-streampass}@postgres:5432/streamservice
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_API_USER: ${MEDIAMTX_API_USER:-api}
      MEDIAMTX_API_PASS: ${MEDIAMTX_API_PASS:-mediamtxpass}
      SUPERADMIN_LOGIN: ${SUPERADMIN_LOGIN:-admin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-adminpass}
      MEDIAMTX_WEBHOOK_SECRET: ${MEDIAMTX_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      mediamtx:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        HLS_UPSTREAM: http://mediamtx:8888
        API_UPSTREAM: http://api:3001
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-https://liga-live.ru}
        NEXT_PUBLIC_SERVER_IP: ${NEXT_PUBLIC_SERVER_IP:-liga-live.ru}
    container_name: streamservice-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_STREAM_BASE_URL: /hls/live
    depends_on:
      - api
      - mediamtx
    restart: unless-stopped

volumes:
  postgres_data:
  recordings_data:
  uploads_data:
