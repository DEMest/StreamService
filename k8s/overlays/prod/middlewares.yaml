# Traefik Middleware: то, что в nginx делали add_header, return 301/404,
# client_max_body_size и rewrite. Ссылаются из Ingress'ов как
# streamservice-<имя>@kubernetescrd.
#
# НЕ перенесено (в этом PR): proxy_cache HLS, limit_req/limit_conn, robots.txt
# для admin./ads., access_log capacity. См. «Условия для PR 2» в k8s/README.md.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    contentTypeNosniff: true
    browserXssFilter: true
    customFrameOptionsValue: SAMEORIGIN
    referrerPolicy: strict-origin-when-cross-origin
---
# Вместо robots.txt с Disallow на admin./ads. (статический ответ Traefik отдать
# не умеет): поддомены закрываются от индексации заголовком.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: noindex
spec:
  headers:
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow"
---
# client_max_body_size 5m в nginx.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit
spec:
  buffering:
    maxRequestBodyBytes: 5242880
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-www
spec:
  redirectRegex:
    regex: '^https?://www\.liga-live\.ru/(.*)'
    replacement: 'https://liga-live.ru/${1}'
    permanent: true
---
# liga-live.ru/admin... → admin.liga-live.ru/admin... (cookie host-only, см.
# DEPLOY.md: админка живёт только на поддомене).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-admin-main
spec:
  redirectRegex:
    regex: '^https?://liga-live\.ru/(admin.*)'
    replacement: 'https://admin.liga-live.ru/${1}'
    permanent: true
---
# Всё лишнее на admin./ads. уезжает на основной сайт (не 404: в общей шапке
# есть обычные ссылки).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-main
spec:
  redirectRegex:
    regex: '^https?://[^/]+/(.*)'
    replacement: 'https://liga-live.ru/${1}'
    permanent: true
---
# ads.liga-live.ru и /admin на нём ведут в единственную страницу кабинета.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ads-to-cabinet
spec:
  redirectRegex:
    regex: '^https?://ads\.liga-live\.ru/.*'
    replacement: 'https://ads.liga-live.ru/admin/ads'
    permanent: true
---
# nginx: `location /api/v1/admin { return 404; }` на основном домене. Traefik
# отдать произвольный 404 не умеет, поэтому путь подменяется на заведомо
# несуществующий, и 404 отвечает уже Next.js.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: block-path
spec:
  replacePath:
    path: /__not-found
---
# /static/x → /streamservice-public/x (публичный бакет MinIO, демо-ролик лендинга).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: static-to-bucket
spec:
  replacePathRegex:
    regex: '^/static/(.*)'
    replacement: '/streamservice-public/${1}'
