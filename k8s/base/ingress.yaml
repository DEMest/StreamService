# Базовый Ingress без хоста и без TLS: подходит для локального прогона в k3d.
# Оверлей prod его удаляет и подставляет боевые Ingress'ы (k8s/overlays/prod).
#
# Маршруты повторяют основной сервер liga-live.ru из
# infra/deploy/nginx-streamservice.conf:
#   /socket.io → api:3001 (чат, WebSocket)
#   всё остальное → web:3000 (он сам проксирует /api и /hls на api через
#   rewrites в next.config.mjs)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site
  labels:
    app.kubernetes.io/part-of: streamservice
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
