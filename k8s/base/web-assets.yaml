apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-assets
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: web-assets
spec:
  selector:
    app.kubernetes.io/name: web-assets
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-assets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-assets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-assets
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx@sha256:8aa63af009a39ecd6c28d61da578a5447378c10bb097a069e3a3e0fb42bb6b19
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: assets
              mountPath: /srv/web-assets
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: assets
          persistentVolumeClaim:
            claimName: web-assets
        - name: config
          configMap:
            name: web-assets-config
            items:
              - key: default.conf
                path: default.conf
