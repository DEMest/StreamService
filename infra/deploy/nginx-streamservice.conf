limit_req_zone $binary_remote_addr zone=global:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conns:10m;
# Телеметрия плеера. Лимит считается ПО IP, а не по зрителю, и в этом вся
# тонкость: за одним Wi-Fi площадки или мобильным NAT сидит весь зал. Каждый
# плеер шлёт 4 запроса в минуту, поэтому 5r/s с запасом покрывает даже полный
# зал за одним адресом, но всё ещё отсекает флуд.
limit_req_zone $binary_remote_addr zone=qoe:10m rate=5r/s;

# Лог для метрик ёмкости (/admin/capacity). Формат ОБЯЗАН совпадать с
# CAPACITY_LOG_FORMAT в apps/api/src/capacity/nginx-log.ts: разъехавшись, они
# молча перестанут понимать друг друга — метрики обнулятся без единой ошибки.
# Разделитель `|`, а не combined: нужны ровно шесть полей и ни одного лишнего.
log_format capacity '$time_iso8601|$status|$body_bytes_sent|$request_time|$upstream_cache_status|$request_uri';

# Кэш для live-HLS: сегменты неизменяемы, отдаём из памяти/диска и разгружаем API+БД.
proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=hls_cache:10m max_size=2g inactive=2m use_temp_path=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name liga-live.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name liga-live.ru;

    ssl_certificate     /etc/ssl/regru/cert.pem;
    ssl_certificate_key /etc/ssl/regru/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    server_tokens off;
    limit_req_status 429;
    limit_conn_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Live-HLS: .ts неизменяемы → кэшируем на 5с ───
    location ~* ^/api/v1/public/orgs/[^/]+/streams/[^/]+/live/hls/.+\.ts$ {
        limit_conn conns 100;
        limit_req zone=global burst=20 nodelay;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache hls_cache;
        # previewKey уходит в КЛЮЧ кэша: запрос без верного ключа получит промах
        # и уйдёт в API (там 404). Приватный сегмент НЕ раздаётся из кэша анонимам.
        proxy_cache_key "$uri|$arg_key";
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 200 5s;
        access_log /var/log/nginx/capacity.log capacity;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }
    # ─── Live-HLS: .m3u8 обновляется часто → кэшируем коротко (1с) ───
    location ~* ^/api/v1/public/orgs/[^/]+/streams/[^/]+/live/hls/.+\.m3u8$ {
        limit_conn conns 100;
        limit_req zone=global burst=20 nodelay;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache hls_cache;
        proxy_cache_key "$uri|$arg_key";
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 200 1s;
        access_log /var/log/nginx/capacity.log capacity;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }

    # ─── Socket.io (чат) — без rate limit ───
    location /socket.io/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── HLS потоки (без буферизации) ───
    location /hls/ {
        limit_conn conns 30;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }

    # ─── Публичная статика лендинга (демо-ролик) → MinIO ───
    # Отдельный ПУБЛИЧНЫЙ бакет streamservice-public (анонимный s3:GetObject).
    # streamservice-archive остаётся приватным — сюда он не попадает.
    # Presigned-ссылки здесь не годятся: живут 300с и обнуляют кэш браузера/CDN,
    # поэтому стабильный URL + Cache-Control из метаданных объекта (immutable).
    # Range-запросы MinIO обслуживает сам (Accept-Ranges: bytes) — перемотка ок.
    location /static/ {
        limit_conn conns 30;
        # Только чтение: анонимный PUT/DELETE отсекаем на краю, не полагаясь
        # на одну лишь bucket-политику MinIO.
        limit_except GET HEAD { deny all; }
        # rewrite + break вместо URI в proxy_pass: единый приём с вариантом
        # конфига, где upstream задан через переменную (там подмена префикса
        # локации не работает).
        rewrite ^/static/(.*)$ /streamservice-public/$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ~97 МБ не буферизуем на диск — отдаём потоком, иначе первый байт
        # уходит клиенту только после полной вычитки объекта из MinIO.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_cache off;

        # MinIO сам отражает ACAO по Origin запроса. Свой add_header без
        # proxy_hide_header дал бы ДВА заголовка — браузер рвёт такой запрос.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Amz-Id-2;
        proxy_hide_header X-Amz-Request-Id;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ─── Телеметрия плеера (метрики ёмкости) ───
    # Своя локация нужна затем, что общий лимит в `location /` (10r/s на IP)
    # делится с обычными запросами страниц: зал за одним NAT выедал бы его на
    # телеметрии, получая 429 на настоящей навигации.
    location = /api/v1/public/qoe {
        limit_req zone=qoe burst=30 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # В метрический лог эти запросы не пишем: они не трафик зрителей.
        access_log off;
    }

    # ─── Админка суперадмина: на основном домене её нет ───
    # Она живёт только на admin.liga-live.ru. Смысл разделения — в cookie:
    # auth-cookie ставятся без атрибута domain, то есть host-only, поэтому вход
    # под организацией на основном домене и вход под суперадмином на поддомене
    # больше не затирают друг друга в одном браузере. Оставь админку доступной
    # на обоих именах — и первый же вход по привычному адресу выбьет вторую
    # сессию, ради которой всё и делалось.
    #
    # Страницы уезжают редиректом, а не в 404: на них ведут живые ссылки (пункт
    # «Организации» в шапке) и старые закладки, и упереться в пустую страницу
    # там, где раздел всего лишь переехал, — худший вариант из возможных.
    # Скрытности 404 тут всё равно не дал бы: имя admin.<домен> угадывается с
    # первой попытки.
    location /admin {
        return 301 https://admin.liga-live.ru$request_uri;
    }
    # А вот API — именно 404. Редирект здесь бессмыслен: cookie host-only, на
    # чужое имя браузер её не отправит, и запрос всё равно упрётся в 401.
    location /api/v1/admin {
        return 404;
    }

    # ─── Все остальное → Next.js ───
    location / {
        limit_conn conns 30;
        limit_req zone=global burst=20 nodelay;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ─── Админка суперадмина: admin.liga-live.ru ───
# Отдельное имя, а не путь на основном домене, ради cookie: они ставятся
# host-only (без атрибута domain), поэтому сессия суперадмина на поддомене и
# сессия организации на основном домене сосуществуют в одном браузере, не
# затирая друг друга. Заодно сужается поверхность: на liga-live.ru админки
# просто нет (см. `return 404` выше).
server {
    listen 80;
    server_name admin.liga-live.ru;

    # Исключение из редиректа: HTTP-01 проверка certbot ходит именно по :80.
    # Путь обязан совпадать с webroot, которым продлевается сертификат
    # основного домена, — иначе продление молча начнёт отваливаться.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name admin.liga-live.ru;

    # Тот же файл, что и у основного домена: certbot выпускает ОДИН сертификат,
    # где admin.liga-live.ru добавлен вторым именем в SAN (--expand). Отдельный
    # сертификат означал бы отдельный срок и отдельное продление — лишний повод
    # однажды получить просроченную админку.
    ssl_certificate     /etc/ssl/regru/cert.pem;
    ssl_certificate_key /etc/ssl/regru/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    server_tokens off;
    limit_req_status 429;
    limit_conn_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Поддомен целиком закрыт от индексации. Свой robots.txt отдаём здесь, а не
    # из приложения: route handler в Next.js строит ответ из SITE_URL и на любом
    # хосте разрешит обход — а нам нужен ровно обратный ответ.
    location = /robots.txt {
        # default_type, а не add_header: nginx и так отдаёт `return 200` с
        # text/plain, а add_header приклеил бы второй Content-Type.
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ─── Страницы админки ───
    location /admin {
        limit_conn conns 30;
        limit_req zone=global burst=20 nodelay;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ─── Форма входа ───
    location = /login {
        limit_conn conns 30;
        limit_req zone=global burst=20 nodelay;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ─── API: только вход и админские ручки ───
    # Публичный и org-API сюда не пускаем: чем меньше живёт на этом имени, тем
    # меньше шансов, что кто-то случайно залогинится тут организацией и
    # перезапишет админскую cookie.
    location /api/v1/auth {
        limit_conn conns 30;
        limit_req zone=global burst=20 nodelay;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/v1/admin {
        limit_req zone=global burst=20 nodelay;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ─── Статика Next.js ───
    location /_next/ {
        limit_conn conns 30;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ─── Всё остальное — на основной сайт ───
    # Именно редирект, а не 404: в шапке админки живут обычные ссылки («/»,
    # «/search»), и клик по логотипу не должен упираться в пустую страницу.
    # Сюда же уезжает /dashboard — кабинет организации на этом имени не нужен.
    location / {
        return 301 https://liga-live.ru$request_uri;
    }
}
