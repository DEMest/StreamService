# СНИМОК ЖИВОГО КОНФИГА с сервера (2026-09-02).
#
# Рабочая копия — /home/rootuser/edge/nginx/conf.d/streamservice.conf в стеке
# edge-nginx; этот файл не монтируется никуда и автодеплоем не применяется.
# Правки переносятся руками в обе стороны, поэтому при любом расхождении
# правой считается серверная версия, а не эта.
#
# Директивы, на которые конфиг опирается, но которых здесь нет, — они заданы
# уровнем выше, в nginx.conf стека edge:
#   limit_req_zone (зоны global, qoe), limit_conn_zone (зона conns),
#   map $http_upgrade $connection_upgrade.
#
# Чего здесь НЕТ, хотя приложение этого ждёт (см. DEPLOY.md):
#   • access_log ... capacity в HLS-локациях — без него экран /admin/capacity
#     не видит трафик зрителей;
#   • отдельной локации /api/v1/public/qoe с собственным лимитом.

# Кэш для live-HLS: сегменты неизменяемы, отдаём из памяти/диска и разгружаем API+БД.
proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=hls_cache:10m max_size=2g inactive=2m use_temp_path=off;

server {
    listen 80;
    # www тут же, а не отдельным блоком: иначе HTTP-01 для www.liga-live.ru
    # не пройдёт (запрос с чужим Host падает в дефолтный сервер и получает 444),
    # и сертификат на www выпустить не выйдет.
    server_name liga-live.ru www.liga-live.ru;

    # ACME HTTP-01. Обязательно ДО редиректа: Let's Encrypt ходит по http, и
    # безусловный 301 на https проверку не проходит.
    # proxy_pass через переменную + resolver — ленивое разрешение имени: когда
    # certbot не запущен, nginx не падает при старте, а отдаёт 502.
    location /.well-known/acme-challenge/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $acme_upstream http://acme-responder:80;
        proxy_pass $acme_upstream;
        proxy_set_header Host $host;
    }

    # Жёстко на голый домен, а не на $host: для liga-live.ru результат тот же,
    # а www сразу схлопывается в канонический адрес за один редирект.
    location / {
        return 301 https://liga-live.ru$request_uri;
    }
}

# www — только редирект на канонический домен. Отдельным блоком, а не
# добавлением имени в основной server: иначе сайт открывался бы по двум
# адресам сразу, что плодит дубли в поиске и ломает cookie, привязанные к домену.
# Сертификат покрывает оба имени (SAN), иначе браузер ругался бы ДО редиректа.
server {
    listen 443 ssl;
    server_name www.liga-live.ru;

    ssl_certificate     /etc/ssl/regru/cert.pem;
    ssl_certificate_key /etc/ssl/regru/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://liga-live.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name liga-live.ru;

    ssl_certificate     /etc/ssl/regru/cert.pem;
    ssl_certificate_key /etc/ssl/regru/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # docker embedded DNS — резолвим upstream лениво
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Дефолтный лимит nginx (1m) режет загрузку картинок орг/превью раньше,
    # чем их отклонит сам API (там лимит 2 МБ, см. FileInterceptor в org.controller.ts).
    client_max_body_size 5m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Live-HLS: .ts неизменяемы → кэшируем на 5с ───
    location ~* ^/api/v1/public/orgs/[^/]+/streams/[^/]+/live/hls/.+\.ts$ {
        limit_conn conns 100;
        limit_req zone=global burst=20 nodelay;
        set $upstream_web streamservice-web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache hls_cache;
        # previewKey уходит в КЛЮЧ кэша: запрос без верного ключа получит промах
        # и уйдёт в API (там 404). Приватный сегмент НЕ раздаётся из кэша анонимам.
        proxy_cache_key "$uri|$arg_key";
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }
    # ─── Live-HLS: .m3u8 обновляется часто → кэшируем коротко (1с) ───
    location ~* ^/api/v1/public/orgs/[^/]+/streams/[^/]+/live/hls/.+\.m3u8$ {
        limit_conn conns 100;
        limit_req zone=global burst=20 nodelay;
        set $upstream_web streamservice-web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache hls_cache;
        proxy_cache_key "$uri|$arg_key";
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 200 1s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }

    # ─── Socket.io (чат) — без rate limit ───
    location /socket.io/ {
        set $upstream_api streamservice-api:3001;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── HLS потоки (без буферизации) ───
    location /hls/ {
        limit_conn conns 30;
        set $upstream_web streamservice-web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }

    # ─── Публичная статика лендинга (демо-ролик) → MinIO ───
    # Отдельный ПУБЛИЧНЫЙ бакет streamservice-public (анонимный s3:GetObject).
    # streamservice-archive остаётся приватным — сюда он не попадает.
    # Presigned-ссылки здесь не годятся: живут 300с и обнуляют кэш браузера/CDN,
    # поэтому стабильный URL + Cache-Control из метаданных объекта (immutable).
    # Range-запросы MinIO обслуживает сам (Accept-Ranges: bytes) — перемотка ок.
    location /static/ {
        limit_conn conns 30;
        # Только чтение: анонимный PUT/DELETE отсекаем на краю, не полагаясь
        # на одну лишь bucket-политику MinIO.
        limit_except GET HEAD { deny all; }
        set $upstream_minio streamservice-minio:9000;
        # rewrite + break: proxy_pass с переменной в адресе не подменяет префикс
        # локации, поэтому имя бакета подставляем в URI явно.
        rewrite ^/static/(.*)$ /streamservice-public/$1 break;
        proxy_pass http://$upstream_minio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ~97 МБ не буферизуем на диск — отдаём потоком, иначе первый байт
        # уходит клиенту только после полной вычитки объекта из MinIO.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_cache off;

        # MinIO сам отражает ACAO по Origin запроса. Свой add_header без
        # proxy_hide_header дал бы ДВА заголовка — браузер рвёт такой запрос.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Amz-Id-2;
        proxy_hide_header X-Amz-Request-Id;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ─── Админка суперадмина: на основном домене её нет ───
    # Она живёт только на admin.liga-live.ru. Смысл разделения — в cookie:
    # auth-cookie ставятся без атрибута domain, то есть host-only, поэтому вход
    # под организацией на основном домене и вход под суперадмином на поддомене
    # больше не затирают друг друга в одном браузере. Оставь админку доступной
    # на обоих именах — и первый же вход по привычному адресу выбьет вторую
    # сессию, ради которой всё и делалось.
    #
    # Страницы уезжают редиректом, а не в 404: на них ведут живые ссылки (пункт
    # «Организации» в шапке) и старые закладки, и упереться в пустую страницу
    # там, где раздел всего лишь переехал, — худший вариант из возможных.
    # Скрытности 404 тут всё равно не дал бы: имя admin.<домен> угадывается с
    # первой попытки.
    location /admin {
        return 301 https://admin.liga-live.ru$request_uri;
    }
    # А вот API — именно 404. Редирект здесь бессмыслен: cookie host-only, на
    # чужое имя браузер её не отправит, и запрос всё равно упрётся в 401.
    location /api/v1/admin {
        return 404;
    }

    # ─── Все остальное → Next.js ───
    location / {
        limit_conn conns 30;
        limit_req zone=global burst=20 nodelay;
        set $upstream_web streamservice-web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ─── MinIO S3 API — прямой TLS-проброс (presigned-ссылки архива) ───
# Отдельный порт вместо location по пути: SigV4 подписывает весь путь запроса
# (endpoint без пути), поэтому проксировать нужно 1:1, без переписывания URI.
# Host форвардим как $http_host (с портом) — presignClient подписывает Host
# ровно с портом endpoint'а (liga-live.ru:9443), MinIO должен увидеть то же самое.
server {
    listen 9443 ssl;
    server_name liga-live.ru;

    ssl_certificate     /etc/ssl/regru/cert.pem;
    ssl_certificate_key /etc/ssl/regru/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # MinIO сам отражает Access-Control-Allow-Origin/Expose-Headers по Origin
    # запроса без всякой bucket-политики (проверено напрямую) — свои add_header
    # здесь НЕ добавляем: задвоенный CORS-заголовок браузер считает ошибкой
    # и рвёт запрос целиком.
    location / {
        set $upstream_minio streamservice-minio:9000;
        proxy_pass http://$upstream_minio;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        client_max_body_size 0;
    }
}

# ─── Админка суперадмина: admin.liga-live.ru ───
# Отдельное имя, а не путь на основном домене, ради cookie: они ставятся
# host-only (без атрибута domain), поэтому сессия суперадмина на поддомене и
# сессия организации на основном домене сосуществуют в одном браузере, не
# затирая друг друга. Заодно сужается поверхность: на liga-live.ru админки
# просто нет (см. `return 404` выше).
server {
    listen 80;
    server_name admin.liga-live.ru;

    # То же исключение из редиректа, что и у основного домена: сертификат общий,
    # значит продлеваются оба имени, и проверка приходит на каждое из них.
    # Блоки обязаны совпадать — разойдясь, они промолчат до самого продления.
    location /.well-known/acme-challenge/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $acme_upstream http://acme-responder:80;
        proxy_pass $acme_upstream;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name admin.liga-live.ru;

    # Тот же файл, что и у основного домена: certbot выпускает ОДИН сертификат,
    # где admin.liga-live.ru добавлен вторым именем в SAN (--expand). Отдельный
    # сертификат означал бы отдельный срок и отдельное продление — лишний повод
    # однажды получить просроченную админку.
    ssl_certificate     /etc/ssl/regru/cert.pem;
    ssl_certificate_key /etc/ssl/regru/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # docker embedded DNS — резолвим upstream лениво (как в блоке liga-live.ru)
    resolver 127.0.0.11 valid=30s ipv6=off;

    server_tokens off;
    limit_req_status 429;
    limit_conn_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Поддомен целиком закрыт от индексации. Свой robots.txt отдаём здесь, а не
    # из приложения: route handler в Next.js строит ответ из SITE_URL и на любом
    # хосте разрешит обход — а нам нужен ровно обратный ответ.
    location = /robots.txt {
        # default_type, а не add_header: nginx и так отдаёт `return 200` с
        # text/plain, а add_header приклеил бы второй Content-Type.
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ─── Страницы админки ───
    location /admin {
        limit_conn conns 30;
        limit_req zone=global burst=20 nodelay;
        set $upstream_web streamservice-web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ─── Форма входа ───
    location = /login {
        limit_conn conns 30;
        limit_req zone=global burst=20 nodelay;
        set $upstream_web streamservice-web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ─── API: только вход и админские ручки ───
    # Публичный и org-API сюда не пускаем: чем меньше живёт на этом имени, тем
    # меньше шансов, что кто-то случайно залогинится тут организацией и
    # перезапишет админскую cookie.
    location /api/v1/auth {
        limit_conn conns 30;
        limit_req zone=global burst=20 nodelay;
        set $upstream_web streamservice-web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/v1/admin {
        limit_req zone=global burst=20 nodelay;
        set $upstream_web streamservice-web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ─── Форма обратной связи ───
    # Живёт в общей шапке (Header → FeedbackModal), а значит есть и на страницах
    # админки. Без своей локации POST уехал бы в catch-all ниже, а редирект
    # превратил бы его в GET на чужое имя — кнопка молча перестала бы работать.
    # Это же и правило на будущее: всё, что дёргают общие компоненты, должно
    # быть перечислено здесь, иначе оно ломается без единой ошибки в сборке.
    location = /api/v1/public/feedback {
        limit_req zone=global burst=20 nodelay;
        set $upstream_web streamservice-web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ─── Статика Next.js ───
    location /_next/ {
        limit_conn conns 30;
        set $upstream_web streamservice-web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ─── Всё остальное — на основной сайт ───
    # Именно редирект, а не 404: в шапке админки живут обычные ссылки («/»,
    # «/search»), и клик по логотипу не должен упираться в пустую страницу.
    # Сюда же уезжает /dashboard — кабинет организации на этом имени не нужен.
    location / {
        return 301 https://liga-live.ru$request_uri;
    }
}
