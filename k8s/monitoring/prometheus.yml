global:
  scrape_interval: 15s
  scrape_timeout: 5s

rule_files:
  - /etc/streamservice-monitoring/rules.yml

scrape_configs:
  - job_name: mediamtx
    static_configs:
      - targets: ['mediamtx:9998']

  - job_name: service-health
    metrics_path: /probe
    params:
      module: [http_ok]
    static_configs:
      - targets:
          - http://api:3001/health
          - http://web:3000/
          - http://minio:9000/minio/health/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
