services:
  # ─── PostgreSQL ───
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-streamservice}-postgres
    environment:
      POSTGRES_DB: streamservice
      POSTGRES_USER: stream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streampass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stream -d streamservice"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── MediaMTX ───
  mediamtx:
    build:
      context: ./infra/mediamtx
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-streamservice}-mediamtx
    ports:
      # Наружу торчит только ингест (SRT/RTMP). HLS (8888) отдаёт API через nginx,
      # а control-API (9997) дёргает только контейнер api по внутренней docker-сети —
      # публиковать их на хост незачем (иначе доступны всей локалке/Tailscale в обход nginx/ufw).
      - "${MEDIAMTX_SRT_PORT:-8890}:8890/udp"
      - "${MEDIAMTX_RTMP_PORT:-1935}:1935/tcp"
    environment:
      MEDIAMTX_WEBHOOK_SECRET: ${MEDIAMTX_WEBHOOK_SECRET:-}
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - recordings_data:/recordings
      - hls_data:/hls
    restart: unless-stopped

  # ─── API ───
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-streamservice}-api
    # host-порт не публикуем: nginx ходит в api по имени контейнера через сеть edge.
    volumes:
      - recordings_data:/recordings
      - uploads_data:/app/uploads
      - hls_data:/hls
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 3001
      DATABASE_URL: postgresql://stream:${POSTGRES_PASSWORD:-streampass}@postgres:5432/streamservice
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_API_USER: ${MEDIAMTX_API_USER:-api}
      MEDIAMTX_API_PASS: ${MEDIAMTX_API_PASS:-mediamtxpass}
      SUPERADMIN_LOGIN: ${SUPERADMIN_LOGIN:-admin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-adminpass}
      MEDIAMTX_WEBHOOK_SECRET: ${MEDIAMTX_WEBHOOK_SECRET:-}
      # Прод (HTTPS) — оставить пустым (тогда secure берётся из NODE_ENV).
      # Тест-стенд по HTTP — выставить COOKIE_SECURE=false в .env, иначе браузер
      # не сохранит cookie и /v1/org/me вернёт 401.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    depends_on:
      postgres:
        condition: service_healthy
      mediamtx:
        condition: service_started
    networks:
      - default
      - edge
    restart: unless-stopped

  # ─── Web ───
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_UPSTREAM: http://api:3001
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3001}
        NEXT_PUBLIC_SERVER_IP: ${NEXT_PUBLIC_SERVER_IP:-localhost}
        # Порты MediaMTX, проброшенные наружу. Зашиваются в строки SRT/RTMP-вставки
        # в Studio UI и старом дашборде. NEXT_PUBLIC_* зашиваются в client-bundle
        # на build-time — после смены значений нужно `docker compose build web`.
        NEXT_PUBLIC_SRT_PORT: ${MEDIAMTX_SRT_PORT:-8890}
        NEXT_PUBLIC_RTMP_PORT: ${MEDIAMTX_RTMP_PORT:-1935}
        NEXT_PUBLIC_HLS_PORT: ${MEDIAMTX_HLS_PORT:-8888}
    container_name: ${COMPOSE_PROJECT_NAME:-streamservice}-web
    # host-порт не публикуем: nginx ходит в web по имени контейнера через сеть edge.
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_STREAM_BASE_URL: /hls/live
      # Runtime-секрет (НЕ NEXT_PUBLIC — в браузер не утекает). Нужен middleware
      # для локальной проверки подписи access-токена. Должен совпадать с JWT_SECRET
      # сервиса api, иначе middleware будет продлевать токен на каждой навигации.
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
    depends_on:
      - api
      - mediamtx
    networks:
      - default
      - edge
    restart: unless-stopped

networks:
  default:
  edge:
    external: true

volumes:
  postgres_data:
  recordings_data:
  uploads_data:
  hls_data: