# Let's Encrypt через cert-manager (HTTP-01 через Traefik). Применяется один
# раз на кластер после установки cert-manager:
#   kubectl apply -f k8s/cluster/cluster-issuer.yaml
# Перед применением подставить настоящий e-mail владельца домена.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACE_WITH_REAL_EMAIL
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
