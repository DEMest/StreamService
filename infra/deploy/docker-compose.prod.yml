# Продакшен конфигурация StreamService (standalone, с nginx на 443)
#
# Использование:
#   docker compose -f docker-compose.yml -f infra/deploy/docker-compose.prod.yml up -d --build

services:
  nginx:
    image: nginx:alpine
    container_name: streamservice-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/deploy/nginx-streamservice.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/regru:/etc/ssl/regru:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  api:
    ports: !override []

  web:
    ports: !override []
