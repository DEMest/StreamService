limit_req_zone $binary_remote_addr zone=global:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conns:10m;

# Кэш для live-HLS: сегменты неизменяемы, отдаём из памяти/диска и разгружаем API+БД.
proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=hls_cache:10m max_size=2g inactive=2m use_temp_path=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name liga-live.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name liga-live.ru;

    ssl_certificate     /etc/ssl/regru/cert.pem;
    ssl_certificate_key /etc/ssl/regru/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    server_tokens off;
    limit_req_status 429;
    limit_conn_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Live-HLS: .ts неизменяемы → кэшируем на 5с ───
    location ~* ^/api/v1/public/orgs/[^/]+/streams/[^/]+/live/hls/.+\.ts$ {
        limit_conn conns 100;
        limit_req zone=global burst=20 nodelay;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache hls_cache;
        # previewKey уходит в КЛЮЧ кэша: запрос без верного ключа получит промах
        # и уйдёт в API (там 404). Приватный сегмент НЕ раздаётся из кэша анонимам.
        proxy_cache_key "$uri|$arg_key";
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }
    # ─── Live-HLS: .m3u8 обновляется часто → кэшируем коротко (1с) ───
    location ~* ^/api/v1/public/orgs/[^/]+/streams/[^/]+/live/hls/.+\.m3u8$ {
        limit_conn conns 100;
        limit_req zone=global burst=20 nodelay;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache hls_cache;
        proxy_cache_key "$uri|$arg_key";
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 200 1s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }

    # ─── Socket.io (чат) — без rate limit ───
    location /socket.io/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── HLS потоки (без буферизации) ───
    location /hls/ {
        limit_conn conns 30;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }

    # ─── Все остальное → Next.js ───
    location / {
        limit_conn conns 30;
        limit_req zone=global burst=20 nodelay;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
