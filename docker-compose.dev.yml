services:
  postgres:
    image: postgres:16-alpine
    container_name: streamservice-dev-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: streamservice
      POSTGRES_USER: stream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streampass}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stream -d streamservice"]
      interval: 5s
      timeout: 5s
      retries: 5

  mediamtx:
    build:
      context: ./infra/mediamtx
      dockerfile: Dockerfile
    container_name: streamservice-dev-mediamtx
    ports:
      - "${MEDIAMTX_SRT_PORT:-8890}:8890/udp"
      - "8888:8888"
      - "9997:9997"
    environment:
      MEDIAMTX_WEBHOOK_SECRET: ${MEDIAMTX_WEBHOOK_SECRET:-}
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - recordings_dev_data:/recordings

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: streamservice-dev-api
    ports:
      - "3001:3001"
    volumes:
      - recordings_dev_data:/recordings
      - uploads_dev_data:/app/uploads
    environment:
      NODE_ENV: development
      API_PORT: 3001
      DATABASE_URL: postgresql://stream:${POSTGRES_PASSWORD:-streampass}@postgres:5432/streamservice
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key}
      CORS_ORIGIN: http://localhost:3000
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_API_USER: ${MEDIAMTX_API_USER:-api}
      MEDIAMTX_API_PASS: ${MEDIAMTX_API_PASS:-mediamtxpass}
      SUPERADMIN_LOGIN: ${SUPERADMIN_LOGIN:-admin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-adminpass}
      MEDIAMTX_WEBHOOK_SECRET: ${MEDIAMTX_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      mediamtx:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        HLS_UPSTREAM: http://mediamtx:8888
        API_UPSTREAM: http://api:3001
        NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
        NEXT_PUBLIC_SERVER_IP: localhost
    container_name: streamservice-dev-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_STREAM_BASE_URL: /hls/live
    depends_on:
      - api
      - mediamtx

volumes:
  postgres_dev_data:
  recordings_dev_data:
  uploads_dev_data:
