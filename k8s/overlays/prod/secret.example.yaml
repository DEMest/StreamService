# ШАБЛОН. Не входит в kustomization и не применяется сам.
# Скопируй ВНЕ репозитория, подставь значения из боевого .env и применяй руками:
#   kubectl apply -f /путь/вне/репо/secret.yaml
# Реальные значения в git не попадают (CONTRIBUTING.md, раздел «Секреты»).
# Как хранить секреты долгосрочно (SealedSecrets, SOPS, внешнее хранилище) —
# решение отдельное.
apiVersion: v1
kind: Secret
metadata:
  name: streamservice-secrets
  namespace: streamservice
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME
  JWT_SECRET: CHANGE_ME
  MEDIAMTX_API_USER: api
  # Обязан совпадать с паролем пользователя api в mediamtx.yml (authInternalUsers).
  MEDIAMTX_API_PASS: CHANGE_ME
  MEDIAMTX_WEBHOOK_SECRET: CHANGE_ME
  SUPERADMIN_LOGIN: CHANGE_ME
  SUPERADMIN_PASSWORD: CHANGE_ME
  # Они же root-учётка MinIO внутри кластера.
  S3_ACCESS_KEY_ID: CHANGE_ME
  S3_SECRET_ACCESS_KEY: CHANGE_ME
  SMTP_USER: ""
  SMTP_PASS: ""
  TELEGRAM_BOT_TOKEN: ""
  GOOGLE_INDEXING_CREDENTIALS: ""
