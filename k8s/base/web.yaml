apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: streamservice
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: streamservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: streamservice
    spec:
      containers:
        - name: web
          # Образ собирается с build-arg'ами (NEXT_PUBLIC_*, API_UPSTREAM,
          # SITE_URL): они зашиваются в бандл на сборке, см. apps/web/Dockerfile
          # и k8s/README.md. API_UPSTREAM=http://api:3001 — это имя сервиса api
          # из api.yaml, менять его нельзя.
          image: streamservice-web
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: streamservice-config
                  key: NODE_ENV
            - name: NEXT_PUBLIC_API_URL
              value: /api
            - name: NEXT_PUBLIC_STREAM_BASE_URL
              value: /hls/live
            # Runtime-секрет middleware для проверки подписи access-токена.
            # Должен совпадать с JWT_SECRET сервиса api (оба из одного Secret).
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: streamservice-secrets
                  key: JWT_SECRET
            - name: SITE_URL
              valueFrom:
                configMapKeyRef:
                  name: streamservice-config
                  key: SITE_URL
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
